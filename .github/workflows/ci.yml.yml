name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest   # Linux: böyük-kiçik hərf xətalarını burada tutur
    defaults: { run: { working-directory: frontend/motohm-react/motohm } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
        env: { VITE_API_URL: https://api.example.com/api }
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet build MotoHM/MotoHM.Api/MotoHM.Api.csproj -c Release
