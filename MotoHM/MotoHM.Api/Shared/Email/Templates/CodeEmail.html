<!DOCTYPE html>
<html lang="{{Lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <title>{{Heading}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;-webkit-text-size-adjust:100%;">

    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f4f4f7;font-size:1px;line-height:1px;">
        {{Preview}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f7" style="background-color:#f4f4f7;">
        <tr>
            <td align="center" style="padding:32px 12px;">

                <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"
                       style="width:100%;max-width:560px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">

                    <tr>
                        <td align="center" bgcolor="#0b0b10" style="background-color:#0b0b10;padding:28px 24px;border-radius:12px 12px 0 0;">
                            <span style="font-size:28px;font-weight:800;letter-spacing:3px;color:#ffffff;">MOTO</span><span style="font-size:28px;font-weight:800;letter-spacing:3px;color:#e11d2e;">HM</span>
                        </td>
                    </tr>
                    <tr>
                        <td height="4" bgcolor="#e11d2e" style="background-color:#e11d2e;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td bgcolor="#ffffff" style="background-color:#ffffff;padding:36px 32px 28px 32px;color:#1f2937;">

                            <h1 style="margin:0 0 20px 0;font-size:22px;line-height:1.3;font-weight:700;color:#111827;">{{Heading}}</h1>

                            <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#374151;">{{Greeting}} <strong>{{Name}}</strong>,</p>
                            <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#374151;">{{Intro}}</p>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center" bgcolor="#f9fafb"
                                        style="background-color:#f9fafb;border:1px solid #e5e7eb;border-left:4px solid #e11d2e;border-radius:8px;padding:22px 12px;">
                                        <span style="font-family:'Courier New',Consolas,monospace;font-size:36px;font-weight:700;letter-spacing:10px;color:#111827;">{{Code}}</span>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:20px 0 0 0;font-size:14px;line-height:1.6;color:#6b7280;text-align:center;">{{ValidText}}</p>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 20px 0;">
                                <tr><td height="1" bgcolor="#e5e7eb" style="background-color:#e5e7eb;font-size:0;line-height:0;">&nbsp;</td></tr>
                            </table>

                            <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
                                <strong style="color:#374151;">{{SecurityTitle}}</strong> {{SecurityText}}
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td align="center" bgcolor="#f9fafb" style="background-color:#f9fafb;padding:20px 24px;border-radius:0 0 12px 12px;border-top:1px solid #e5e7eb;">
                            <p style="margin:0 0 4px 0;font-size:12px;line-height:1.5;color:#9ca3af;">{{Footer}}</p>
                            <p style="margin:0;font-size:12px;line-height:1.5;color:#9ca3af;">&copy; MotoHM</p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
